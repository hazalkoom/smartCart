<section id="all-products" class="bookshelf py-5 my-5">
	<div class="container">
		<div class="row">
			<div class="col-md-12">

				<div class="section-header align-center">
					<div class="title">
						<span>Browse our catalog</span>
					</div>
					<h2 class="section-title">All Products</h2>
				</div>

				<!-- Loading State -->
				<div *ngIf="isLoading" class="text-center py-5">
					<div class="spinner-border text-primary" role="status">
						<span class="visually-hidden">Loading...</span>
					</div>
					<p class="mt-3">Loading products...</p>
				</div>

				<!-- Error State -->
				<div *ngIf="error && !isLoading" class="alert alert-danger text-center" role="alert">
					{{ error }}
				</div>

				<!-- Empty State -->
				<div *ngIf="!isLoading && !error && products.length === 0" class="text-center py-5">
					<p class="text-muted">No products available at the moment.</p>
				</div>

				<!-- Products Grid -->
				<div *ngIf="!isLoading && !error && products.length > 0" class="tab-content">
					<div id="all-genre" data-tab-content class="active">
						<div class="row">
							<div class="col-md-3" *ngFor="let product of products" data-aos="fade-up">
								<div class="product-item">
									<figure class="product-style">
										<img 
											[src]="product.images && product.images.length > 0 ? product.images[0] : 'assets/images/placeholder.jpg'" 
											[alt]="product.name" 
											class="product-item">
										<button type="button" class="add-to-cart" data-product-tile="add-to-cart">
											Add to Cart
										</button>
									</figure>
									<figcaption>
										<h3>{{ product.name }}</h3>
										<span>{{ product.categoryId?.name || 'Uncategorized' }}</span>
										<div class="item-price">$ {{ product.price.toFixed(2) }}</div>
									</figcaption>
								</div>
							</div>
						</div>
					</div>
				</div>
				
			</div>
		</div>
	</div>
</section>
