<section id="account-page" class="py-5 my-5">
	<div class="container">
		<div class="row">
			<div class="col-md-12">
				<div class="section-header align-center">
					<h2 class="section-title">My Account</h2>
				</div>
			</div>
		</div>

		<div *ngIf="isLoading" class="text-center py-5">
			<p>Loading...</p>
		</div>

		<div *ngIf="errorMessage" class="alert alert-danger" role="alert">
			{{ errorMessage }}
		</div>

		<div *ngIf="!isLoading && !errorMessage" class="row">

			<div class="col-md-5">
				<div class="form-wrapper">
					<h4>My Profile</h4>
					<hr class="my-3">
					<form>
						<div class="row">
							<div class="col-md-6 mb-3">
								<label for="firstName" class="form-label">First Name</label>
								<input type="text" class="form-control" id="firstName" [value]="user?.firstName || ''" readonly>
							</div>
							<div class="col-md-6 mb-3">
								<label for="lastName" class="form-label">Last Name</label>
								<input type="text" class="form-control" id="lastName" [value]="user?.lastName || ''" readonly>
							</div>
						</div>
						<div class="mb-3">
							<label for="email" class="form-label">Email address</label>
							<input type="email" class="form-control" id="email" [value]="user?.email || ''" disabled>
						</div>
						<div class="mb-3">
							<label for="role" class="form-label">Role</label>
							<input type="text" class="form-control" id="role" [value]="user?.role || ''" disabled>
						</div>
					</form>
				</div>
			</div>

			<div class="col-md-7">
				<h4>My Orders</h4>
				<hr class="my-3">
				<div *ngIf="orders.length === 0" class="alert alert-info">
					You have no orders yet.
				</div>
				<table *ngIf="orders.length > 0" class="table table-hover order-history-table">
					<thead>
						<tr>
							<th scope="col">Order #</th>
							<th scope="col">Date</th>
							<th scope="col">Status</th>
							<th scope="col">Total</th>
							<th scope="col"></th>
						</tr>
					</thead>
					<tbody>
						<tr *ngFor="let order of orders">
							<th scope="row">{{ order.orderNumber }}</th>
							<td>{{ formatDate(order.createdAt) }}</td>
							<td><span class="order-status" [ngClass]="getOrderStatusClass(order.status)">{{ order.status }}</span></td>
							<td>$ {{ order.total.toFixed(2) }}</td>
							<td><a [routerLink]="['/orders', order._id]" class="btn btn-outline-dark btn-sm">View</a></td>
						</tr>
					</tbody>
				</table>
			</div>

		</div>
	</div>
</section>
