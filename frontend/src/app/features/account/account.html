<section id="account-page" class="py-5 my-5">
	<div class="container">
		<div class="row">
			<div class="col-md-12">
				<div class="section-header align-center">
					<h2 class="section-title">My Account</h2>
				</div>
			</div>
		</div>

		<div class="row">

			<div class="col-md-5">
				<div class="form-wrapper">
					<h4>My Profile</h4>
					<hr class="my-3">
					<form>
						<div class="row">
							<div class="col-md-6 mb-3">
								<label for="firstName" class="form-label">First Name</label>
								<input type="text" class="form-control" id="firstName" value="Order">
							</div>
							<div class="col-md-6 mb-3">
								<label for="lastName" class="form-label">Last Name</label>
								<input type="text" class="form-control" id="lastName" value="Tester">
							</div>
						</div>
						<div class="mb-3">
							<label for="email" class="form-label">Email address</label>
							<input type="email" class="form-control" id="email" value="customer-order@test.com" disabled>
						</div>
						<div class="mb-3">
							<label for="phone" class="form-label">Phone (Optional)</label>
							<input type="tel" class="form-control" id="phone" placeholder="Your phone number">
						</div>
						<div class="d-grid">
							<button type="submit" class="btn btn-primary" style="margin-top: 20px;">Update Profile</button>
						</div>
					</form>
				</div>
			</div>

			<div class="col-md-7">
				<h4>My Orders</h4>
				<hr class="my-3">
				<table class="table table-hover order-history-table">
					<thead>
						<tr>
							<th scope="col">Order #</th>
							<th scope="col">Date</th>
							<th scope="col">Status</th>
							<th scope="col">Total</th>
							<th scope="col"></th>
						</tr>
					</thead>
					<tbody>
						<tr>
							<th scope="row">2025-11-13-F654A6</th>
							<td>Nov 13, 2025</td>
							<td><span class="order-status shipped">Shipped</span></td>
							<td>$ 250.00</td>
							<td><a href="#" class="btn btn-outline-dark btn-sm">View</a></td>
						</tr>
						<tr>
							<th scope="row">2025-11-13-687FE3</th>
							<td>Nov 13, 2025</td>
							<td><span class="order-status delivered">Delivered</span></td>
							<td>$ 100.00</td>
							<td><a href="#" class="btn btn-outline-dark btn-sm">View</a></td>
						</tr>
						<tr>
							<th scope="row">2025-11-12-A1B2C3</th>
							<td>Nov 12, 2025</td>
							<td><span class="order-status pending">Pending</span></td>
							<td>$ 40.00</td>
							<td><a href="#" class="btn btn-outline-dark btn-sm">View</a></td>
						</tr>
					</tbody>
				</table>
			</div>

		</div>
	</div>
</section>
