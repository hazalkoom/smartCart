<div class="verify-email-container">
  <div class="verify-email-card">
    @if (status === 'verifying') {
      <div class="icon-container verifying">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
      <h2 class="mt-4">Verifying Email</h2>
      <p class="text-muted">{{ message }}</p>
    }

    @if (status === 'success') {
      <div class="icon-container success">
        <i class="icon icon-check-circle" style="font-size: 4rem; color: var(--success-color);"></i>
      </div>
      <h2 class="mt-4">Email Verified!</h2>
      <p class="text-muted">{{ message }}</p>
      <div class="mt-4">
        <a routerLink="/" class="btn btn-primary px-4 py-2">Go to Homepage</a>
      </div>
    }

    @if (status === 'error') {
      <div class="icon-container error">
        <i class="icon icon-x-circle" style="font-size: 4rem; color: var(--danger-color);"></i>
      </div>
      <h2 class="mt-4">Verification Failed</h2>
      <p class="text-danger">{{ message }}</p>
      <div class="mt-4">
        <a routerLink="/account" class="btn btn-outline-primary px-4 py-2">Go to Account to Resend</a>
      </div>
    }
  </div>
</div>
