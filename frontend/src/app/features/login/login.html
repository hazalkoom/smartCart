<section id="login-page" class="py-5 my-5">
	<div class="container">
		<div class="row">
			<div class="col-md-12">
				<div class="section-header align-center">
					<h2 class="section-title">Login to your account</h2>
				</div>
			</div>
		</div>

		<div class="row">
			<div class="col-md-12">
				
				<div class="form-wrapper">
					<form>
						<div class="mb-3">
							<label for="email" class="form-label">Email address</label>
							<input type="email" class="form-control" id="email" placeholder="name@example.com">
						</div>
						<div class="mb-3">
							<label for="password" class="form-label">Password</label>
							<input type="password" class="form-control" id="password" placeholder="Password">
						</div>
						<div class="d-grid">
							<button type="submit" class="btn btn-primary btn-lg" style="margin-top: 20px;">Login</button>
						</div>

						<div class="text-center mt-4">
							<p>Don't have an account? <a href="register.html">Create one</a></p>
							<a href="forgot-password.html">Forgot your password?</a>
						</div>
					</form>
				</div>

			</div>
		</div>
	</div>
</section>
