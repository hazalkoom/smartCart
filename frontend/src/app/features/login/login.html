<section id="login-page" class="py-5 my-5">
	<div class="container">
		<div class="row">
			<div class="col-md-12">
				<div class="section-header align-center">
					<h2 class="section-title">Login to your account</h2>
				</div>
			</div>
		</div>

		<div class="row">
			<div class="col-md-12">
				
				<div class="form-wrapper">
					<form (ngSubmit)="onLogin()">
						
						<!-- Error Message -->
						<div *ngIf="errorMessage" class="alert alert-danger" role="alert">
							{{ errorMessage }}
						</div>

						<div class="mb-3">
							<label for="email" class="form-label">Email address</label>
							<input 
								type="email" 
								class="form-control" 
								id="email" 
								name="email"
								[(ngModel)]="email"
								placeholder="name@example.com"
								required>
						</div>
						<div class="mb-3">
							<label for="password" class="form-label">Password</label>
							<input 
								type="password" 
								class="form-control" 
								id="password" 
								name="password"
								[(ngModel)]="password"
								placeholder="Password"
								required>
						</div>
						<div class="d-grid">
							<button 
								type="submit" 
								class="btn btn-primary btn-lg" 
								style="margin-top: 20px;"
								[disabled]="isLoading">
								{{ isLoading ? 'Logging in...' : 'Login' }}
							</button>
						</div>

						<div class="text-center mt-4">
							<p>Don't have an account? <a routerLink="/register">Create one</a></p>
						</div>
					</form>
				</div>

			</div>
		</div>
	</div>
</section>
