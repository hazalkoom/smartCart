<section class="py-5 my-5">
  <div class="container" style="max-width: 880px;">
    <div class="section-header align-center mb-5">
      <h2 class="section-title">Help Center</h2>
      <p>Tell us how we can help and we’ll get back to you.</p>
    </div>

    <div *ngIf="submitted" class="alert alert-success mb-4" role="alert">
      Thanks! Your request has been recorded.
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-body p-4 p-md-5">
        <form #helpForm="ngForm" (ngSubmit)="onSubmit(helpForm)">
          <div class="mb-3">
            <label class="form-label" for="topic">What do you want?</label>
            <select id="topic" name="topic" class="form-select" required [(ngModel)]="formData.topic">
              <option value="report-problem">Report a problem</option>
              <option value="suggest-edits">Suggest edits</option>
              <option value="general">General</option>
              <option value="contact-owner">Contact the owner</option>
            </select>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label" for="name">Name</label>
              <input id="name" name="name" type="text" class="form-control" required [(ngModel)]="formData.name" />
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label" for="email">Email</label>
              <input id="email" name="email" type="email" class="form-control" required [(ngModel)]="formData.email" />
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label" for="message">Message</label>
            <textarea id="message" name="message" class="form-control" rows="6" required [(ngModel)]="formData.message"></textarea>
          </div>

          <button type="submit" class="btn btn-primary px-4" [disabled]="helpForm.invalid">
            Send Request
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
