<section class="py-5 my-5">
  <div class="container">
    
    <div class="section-header align-center mb-5">
      <h2 class="section-title">Browse Categories</h2>
    </div>

    <div *ngIf="isLoading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Error state -->
    <div *ngIf="!isLoading && errorMessage" class="text-center py-5">
      <i class="bi bi-slash-circle-fill category-error-icon"></i>
      <p class="mt-3 text-muted">{{ errorMessage }}</p>
    </div>

    <!-- Empty state -->
    <div *ngIf="!isLoading && !errorMessage && categories.length === 0" class="text-center py-5">
      <i class="bi bi-grid-3x3-gap-fill category-empty-icon"></i>
      <p class="mt-3 text-muted">No categories available at the moment.</p>
    </div>

    <div class="row" *ngIf="!isLoading && !errorMessage && categories.length > 0">
      <div class="col-md-4 col-6 mb-4" *ngFor="let cat of categories">
        
        <a [routerLink]="['/products']" [queryParams]="{ category: cat._id }" class="category-card-link">
          <div class="category-card p-4 text-center">
            <div class="icon-wrapper mb-3">
              <i [ngClass]="getCategoryIcon(cat.name)"></i>
            </div>
            
            <h3 class="category-name">{{ cat.name }}</h3>
            <p class="text-muted category-desc" *ngIf="cat.description">{{ cat.description }}</p>
            
            <span class="category-browse-link">
              Browse <i class="bi bi-arrow-right"></i>
            </span>
          </div>
        </a>

      </div>
    </div>

  </div>
</section>
