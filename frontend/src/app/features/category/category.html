<section class="py-5 my-5">
  <div class="container">
    
    <div class="section-header align-center mb-5">
      <h2 class="section-title">Browse Categories</h2>
    </div>

    <div *ngIf="isLoading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div class="row" *ngIf="!isLoading">
      <div class="col-md-4 mb-4" *ngFor="let cat of categories">
        
        <div class="category-card p-4 text-center" style="border: 1px solid #EAE8DF; border-radius: 8px; transition: all 0.3s;">
          <div class="icon-wrapper mb-3">
            <i class="icon icon-notes" style="font-size: 3rem; color: #C5A992;"></i>
          </div>
          
          <h3 class="mb-3">{{ cat.name }}</h3>
          <p class="text-muted" *ngIf="cat.description">{{ cat.description }}</p>
          
          <a [routerLink]="['/products']" [queryParams]="{ category: cat._id }" class="btn btn-outline-accent btn-small">
            View Books
          </a>
        </div>

      </div>
    </div>

  </div>
</section>
