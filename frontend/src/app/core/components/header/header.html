<div id="header-wrap">

  <header id="header">
    <div class="container-fluid">
      <div class="row align-items-center">

        <div class="col-md-2 col-6">
          <div class="main-logo">
            <a routerLink="/" class="brand-link">
              <img src="assets/images/logo.png" alt="Electrofied logo" class="brand-logo" />
            </a>
          </div>
        </div>

        <div class="col-md-8 d-none d-md-block">
          <nav id="navbar">
            <div class="main-menu stellarnav">
              <ul class="menu-list">
                <li class="menu-item"><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a></li>
                <li class="menu-item"><a routerLink="/products" routerLinkActive="active" class="nav-link">All Products</a></li>
                <li class="menu-item"><a routerLink="/categories" routerLinkActive="active" class="nav-link">Categories</a></li>
                <li *ngIf="isLoggedIn" class="menu-item"><a routerLink="/wishlist" routerLinkActive="active" class="nav-link">Wishlist</a></li>
                
                <li *ngIf="!isLoggedIn" class="menu-item"><a routerLink="/login" routerLinkActive="active" class="nav-link">Login</a></li>
                <li *ngIf="!isLoggedIn" class="menu-item"><a routerLink="/register" routerLinkActive="active" class="nav-link">Register</a></li>
              </ul>
            </div>
          </nav>
        </div>

        <div class="col-md-2 col-6">
          <div class="right-element">
            
            <a *ngIf="!isLoggedIn" routerLink="/login" class="user-account for-buy d-none d-md-inline-block">
              <i class="icon icon-user"></i>
              <span class="header-label">Login</span>
            </a>

            <div *ngIf="isLoggedIn" class="d-none d-md-inline-block">
              <a routerLink="/account" class="user-account for-buy header-user-link" title="My Account">
                <i class="icon icon-user"></i>
                <span class="header-label">Hi, {{ userName || 'User' }}</span>
              </a>
              
              <a (click)="onLogout()" class="user-account for-buy header-logout" title="Logout" aria-label="Logout">
                <i class="icon icon-close"></i>
              </a>
            </div>

            <a routerLink="/cart" class="cart for-buy">
              <i class="icon icon-clipboard"></i>
              <span *ngIf="cartCount > 0" class="cart-badge">{{ cartCount }}</span>
            </a>

            <!-- Mobile hamburger -->
            <button 
              class="hamburger d-md-none" 
              (click)="toggleMobileMenu()" 
              [attr.aria-expanded]="mobileMenuOpen"
              aria-label="Toggle navigation menu">
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
            </button>

          </div>
        </div>

      </div>
    </div>
  </header>

  <!-- Mobile Menu Overlay -->
  <div class="mobile-overlay" 
       [class.open]="mobileMenuOpen" 
       (click)="closeMobileMenu()"></div>

  <!-- Mobile Slide-in Menu -->
  <nav class="mobile-nav" [class.open]="mobileMenuOpen" aria-label="Mobile navigation">
    <div class="mobile-nav-header">
      <span class="mobile-nav-title">Menu</span>
      <button class="mobile-nav-close" (click)="closeMobileMenu()" aria-label="Close menu">
        <i class="icon icon-close"></i>
      </button>
    </div>
    
    <ul class="mobile-nav-list">
      <li><a routerLink="/" (click)="closeMobileMenu()" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a></li>
      <li><a routerLink="/products" (click)="closeMobileMenu()" routerLinkActive="active">All Products</a></li>
      <li><a routerLink="/categories" (click)="closeMobileMenu()" routerLinkActive="active">Categories</a></li>
      <li *ngIf="isLoggedIn"><a routerLink="/wishlist" (click)="closeMobileMenu()" routerLinkActive="active">Wishlist</a></li>
      <li *ngIf="isLoggedIn"><a routerLink="/account" (click)="closeMobileMenu()" routerLinkActive="active">My Account</a></li>
      <li *ngIf="isLoggedIn"><a routerLink="/cart" (click)="closeMobileMenu()" routerLinkActive="active">Cart <span *ngIf="cartCount > 0" class="cart-badge-inline">{{ cartCount }}</span></a></li>
      <li *ngIf="!isLoggedIn"><a routerLink="/login" (click)="closeMobileMenu()" routerLinkActive="active">Login</a></li>
      <li *ngIf="!isLoggedIn"><a routerLink="/register" (click)="closeMobileMenu()" routerLinkActive="active">Register</a></li>
    </ul>

    <div class="mobile-nav-footer" *ngIf="isLoggedIn">
      <a (click)="onLogout()" class="mobile-logout-btn">
        <i class="icon icon-close"></i> Logout
      </a>
    </div>
  </nav>

</div>```
