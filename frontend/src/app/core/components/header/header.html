<header class="sc-navbar" [class.scrolled]="isScrolled">
  <div class="sc-navbar-inner">
    <a routerLink="/" class="sc-logo" (click)="closeMobileMenu()">
      <div class="sc-logo-icon">
        <i class="bi bi-lightning-charge-fill"></i>
      </div>
      <span class="sc-logo-text">Electrofied</span>
    </a>

    <nav class="sc-nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/products" routerLinkActive="active">Products</a>
      <a routerLink="/categories" routerLinkActive="active">Categories</a>
      <a routerLink="/gift-finder" routerLinkActive="active" class="sc-nav-special">
        <i class="bi bi-gift-fill"></i> Gift Finder
      </a>
      <a routerLink="/about" routerLinkActive="active">About</a>
      <a *ngIf="isAdmin" routerLink="/admin" routerLinkActive="active">Admin</a>
    </nav>

    <div class="sc-nav-actions">
      <button class="sc-icon-btn" (click)="toggleSearch()" aria-label="Search">
        <i class="bi bi-search"></i>
      </button>

      <a routerLink="/wishlist" class="sc-icon-btn" aria-label="Wishlist" *ngIf="authReady && hasAuthenticatedSession">
        <i class="bi bi-heart"></i>
        <span class="sc-badge" *ngIf="wishlistCount > 0">{{ wishlistCount }}</span>
      </a>

      <a routerLink="/cart" class="sc-icon-btn" aria-label="Cart">
        <i class="bi bi-cart3"></i>
        <span class="sc-badge sc-badge-primary" *ngIf="cartCount > 0">{{ cartCount }}</span>
      </a>

      <app-notification-bell *ngIf="authReady && hasAuthenticatedSession"></app-notification-bell>

      <div class="dropdown" *ngIf="authReady && hasAuthenticatedSession">
        <button class="sc-user-btn dropdown-toggle" data-bs-toggle="dropdown" type="button" aria-expanded="false">
          <div class="sc-avatar"><i class="bi bi-person-fill"></i></div>
          <span class="sc-user-name">{{ userName || 'Account' }}</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" routerLink="/account"><i class="bi bi-person"></i> My Account</a></li>
          <li><a class="dropdown-item" [routerLink]="['/account']" fragment="orders"><i class="bi bi-box-seam"></i> Orders</a></li>
          <li><a class="dropdown-item" routerLink="/wishlist"><i class="bi bi-heart"></i> Wishlist</a></li>
          <li *ngIf="isAdmin"><a class="dropdown-item" routerLink="/admin"><i class="bi bi-grid-1x2"></i> Admin</a></li>
          <li><hr class="dropdown-divider" style="border-color: var(--border)"></li>
          <li><button class="dropdown-item text-danger" (click)="logout()" type="button"><i class="bi bi-box-arrow-right"></i> Logout</button></li>
        </ul>
      </div>

      <div class="sc-auth-links" *ngIf="authReady && showGuestLinks">
        <a routerLink="/login" class="sc-auth-link">Login</a>
        <a routerLink="/register" class="sc-auth-link">Sign Up</a>
      </div>

      <button class="sc-hamburger" (click)="toggleMobileMenu()" aria-label="Menu">
        <span [class.open]="mobileMenuOpen"></span>
        <span [class.open]="mobileMenuOpen"></span>
        <span [class.open]="mobileMenuOpen"></span>
      </button>
    </div>
  </div>

  <div class="sc-search-bar" [class.visible]="searchOpen">
    <div class="sc-search-inner">
      <i class="bi bi-search"></i>
      <input type="text" placeholder="Search products, brands, categories..." [(ngModel)]="searchQuery" (keyup.enter)="submitSearch()" />
      <button class="sc-search-close" (click)="toggleSearch()" type="button"><i class="bi bi-x-lg"></i></button>
    </div>
  </div>

  <div class="sc-mobile-menu" [class.open]="mobileMenuOpen">
    <a routerLink="/" (click)="closeMobileMenu()">Home</a>
    <a routerLink="/products" (click)="closeMobileMenu()">Products</a>
    <a routerLink="/categories" (click)="closeMobileMenu()">Categories</a>
    <a routerLink="/gift-finder" (click)="closeMobileMenu()" class="sc-nav-special"><i class="bi bi-gift-fill"></i> Gift Finder</a>
    <a routerLink="/about" (click)="closeMobileMenu()">About</a>
    <a routerLink="/wishlist" (click)="closeMobileMenu()" *ngIf="authReady && hasAuthenticatedSession">Wishlist</a>
    <a routerLink="/account" (click)="closeMobileMenu()" *ngIf="authReady && hasAuthenticatedSession">Account</a>
    <a [routerLink]="['/account']" fragment="orders" (click)="closeMobileMenu()" *ngIf="authReady && hasAuthenticatedSession">Orders</a>
    <a routerLink="/admin" (click)="closeMobileMenu()" *ngIf="isAdmin">Admin</a>
    <a routerLink="/login" (click)="closeMobileMenu()" *ngIf="authReady && showGuestLinks">Login</a>
    <a routerLink="/register" (click)="closeMobileMenu()" *ngIf="authReady && showGuestLinks">Register</a>
    <a href="javascript:void(0)" (click)="logout()" *ngIf="authReady && hasAuthenticatedSession">Logout</a>
  </div>
</header>
