<!DOCTYPE html>
<html lang="en">

<head>
	<title>SmartCart - Shopping Cart</title>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="format-detection" content="telephone=no">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="author" content="">
	<meta name="keywords" content="">
	<meta name="description" content="">

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">

	<link rel="stylesheet" type="text/css" href="css/normalize.css">
	<link rel="stylesheet" type="text/css" href="icomoon/icomoon.css">
	<link rel="stylesheet" type="text/css" href="css/vendor.css">
	<link rel="stylesheet" type="text/css" href="style.css">
	
	</head>

<body>

	<div id="header-wrap">
		</div><section id="cart-page" class="py-5 my-5">
		<div class="container">
			<div class="row">
				<div class="col-md-12">
					<div class="section-header align-center">
						<h2 class="section-title">Shopping Cart</h2>
					</div>
				</div>
			</div>

			<div class="row">
				<div class="col-md-8">
					<table class="table cart-table">
						<thead>
							<tr>
								<th scope="col">Product</th>
								<th scope="col">Price</th>
								<th scope="col">Quantity</th>
								<th scope="col">Subtotal</th>
								<th scope="col"></th>
							</tr>
						</thead>
						<tbody>
							<tr>
								<td>
									<div class="product-item">
										<img src="images/tab-item1.jpg" alt="Product">
										<div class="product-name">
											<h5>Portrait photography</h5>
											<span class="text-muted">Adam Silber</span>
										</div>
									</div>
								</td>
								<td>$ 40.00</td>
								<td>
									<input type="number" name="quantity" value="2" min="1" class="form-control quantity-input">
								</td>
								<td>$ 80.00</td>
								<td>
									<a href="#" class="remove-item">×</a>
								</td>
							</tr>
							<tr>
								<td>
									<div class="product-item">
										<img src="images/tab-item2.jpg" alt="Product">
										<div class="product-name">
											<h5>Once upon a time</h5>
											<span class="text-muted">Klien Marry</span>
										</div>
									</div>
								</td>
								<td>$ 35.00</td>
								<td>
									<input type="number" name="quantity" value="1" min="1" class="form-control quantity-input">
								</td>
								<td>$ 35.00</td>
								<td>
									<a href="#" class="remove-item">×</a>
								</td>
							</tr>
						</tbody>
					</table>
					
					<div class="cart-buttons mt-4 d-flex justify-content-between">
						
						<a href="products.html" class="btn btn-outline-primary">
							<i class="icon icon-arrow-left" style="margin-right: 10px;"></i>Continue Shopping
						</a>

						<button class="btn btn-primary">Update Cart</button>
					</div>

				</div>

				<div class="col-md-4">
					<div class="cart-totals">
						<h4 class="section-title" style="font-size: 1.5em; margin-bottom: 30px;">Cart Totals</h4>
						<ul class="list-group list-group-flush">
							<li class="list-group-item d-flex justify-content-between align-items-center">
								Subtotal
								<span>$ 115.00</span>
							</li>
							<li class="list-group-item d-flex justify-content-between align-items-center">
								Shipping
								<span>$ 5.00</span>
							</li>
							<li class="list-group-item d-flex justify-content-between align-items-center" style="font-weight: bold; font-size: 1.2em; color: var(--dark-color);">
								Total
								<span>$ 120.00</span>
							</li>
						</ul>
						<a href="checkout.html" class="btn btn-primary w-100" style="margin-top: 30px; padding: 1em;">Proceed to Checkout</a>
					</div>
				</div>

			</div>
		</div>
	</section>
	
	<footer id="footer">
		</footer>

	<div id="footer-bottom">
		</div>

</body>
</html>
