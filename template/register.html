<!DOCTYPE html>
<html lang="en">

<head>
	<title>SmartCart - Create Account</title> <meta charset="utf-t">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">

	<link rel="stylesheet" type="text/css" href="css/normalize.css">
	<link rel="stylesheet" type="text/css" href="icomoon/icomoon.css">
	<link rel="stylesheet" type="text/css" href="css/vendor.css">
	<link rel="stylesheet" type="text/css" href="style.css">
	
	<style>
		.form-wrapper {
			max-width: 500px;
			margin: 0 auto;
			padding: 40px;
			background: #fff;
			border: 1px solid #EAE8DF;
		}
		.form-wrapper .form-control {
			height: 55px;
			border-color: #EAE8DF;
		}
		.form-wrapper .form-control:focus {
			border-color: var(--accent-color);
			box-shadow: 0 0 0 0.25rem rgba(197, 169, 146, .25);
		}
	</style>

</head>

<body>

	<div id="header-wrap">
		<header id="header">
			</header>
	</div><section id="register-page" class="py-5 my-5">
		<div class="container">
			<div class="row">
				<div class="col-md-12">
					<div class="section-header align-center">
						<h2 class="section-title">Create an Account</h2>
					</div>
				</div>
			</div>

			<div class="row">
				<div class="col-md-12">
					
					<div class="form-wrapper">
						<form>
							<div class="row">
								<div class="col-md-6 mb-3">
									<label for="firstName" class="form-label">First Name</label>
									<input type="text" class="form-control" id="firstName" placeholder="John">
								</div>
								<div class="col-md-6 mb-3">
									<label for="lastName" class="form-label">Last Name</label>
									<input type="text" class="form-control" id="lastName" placeholder="Doe">
								</div>
							</div>
							
							<div class="mb-3">
								<label for="email" class="form-label">Email address</label>
								<input type="email" class="form-control" id="email" placeholder="name@example.com">
							</div>
							<div class="mb-3">
								<label for="password" class="form-label">Password</label>
								<input type="password" class="form-control" id="password" placeholder="Password">
							</div>
							<div class="d-grid">
								<button type="submit" class="btn btn-primary btn-lg" style="margin-top: 20px;">Create Account</button>
							</div>

							<div class="text-center mt-4">
								<p>Already have an account? <a href="login.html">Login</a></p>
							</div>
						</form>
					</div>

				</div>
			</div>
		</div>
	</section>
	
	<footer id="footer">
		</footer>

	<div id="footer-bottom">
		</div>

</body>
</html>
