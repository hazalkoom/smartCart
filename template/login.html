<!DOCTYPE html>
<html lang="en">

<head>
	<title>SmartCart - Login</title> <meta charset="utf-t">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">

	<link rel="stylesheet" type="text/css" href="css/normalize.css">
	<link rel="stylesheet" type="text/css" href="icomoon/icomoon.css">
	<link rel="stylesheet" type="text/css" href="css/vendor.css">
	<link rel="stylesheet" type="text/css" href="style.css">
	
	<style>
		.form-wrapper {
			max-width: 500px;
			margin: 0 auto;
			padding: 40px;
			background: #fff;
			border: 1px solid #EAE8DF;
		}
		.form-wrapper .form-control {
			height: 55px;
			border-color: #EAE8DF;
		}
		.form-wrapper .form-control:focus {
			border-color: var(--accent-color);
			box-shadow: 0 0 0 0.25rem rgba(197, 169, 146, .25);
		}
	</style>

</head>

<body>

	<div id="header-wrap">
		<header id="header">
			<div class="container-fluid">
				<div class="row">

					<div class="col-md-2">
						<div class="main-logo">
							<a href="index.html"><img src="images/main-logo.png" alt="logo"></a>
						</div>
					</div>

					<div class="col-md-8">
						<nav id="navbar">
							<div class="main-menu stellarnav">
								<ul class="menu-list">
									<li class="menu-item"><a href="index.html" class="nav-link">Home</a></li>
									<li class="menu-item"><a href="products.html" class="nav-link">All Products</a></li>
									<li class="menu-item"><a href="categories.html" class="nav-link">Categories</a></li>
								</ul>
								<div class="hamburger">
									<span class="bar"></span>
									<span class="bar"></span>
									<span class="bar"></span>
								</div>
							</div>
						</nav>
					</div>

					<div class="col-md-2">
						<div class="right-element">
							<a href="login.html" class="user-account for-buy">
								<i class="icon icon-user"></i>
							</a>
							<a href="cart.html" class="cart for-buy">
								<i class="icon icon-clipboard"></i>
							</a>
							<div class="action-menu">
								<div class="search-bar">
									<a href="#" class="search-button search-toggle" data-selector="#header-wrap">
										<i class="icon icon-search"></i>
									</a>
									<form role="search" method="get" class="search-box">
										<input class="search-field text search-input" placeholder="Search" type="search">
									</form>
								</div>
							</div>
						</div></div>

				</div>
			</div>
		</header>
	</div><section id="login-page" class="py-5 my-5">
		<div class="container">
			<div class="row">
				<div class="col-md-12">
					<div class="section-header align-center">
						<h2 class="section-title">Login to your account</h2>
					</div>
				</div>
			</div>

			<div class="row">
				<div class="col-md-12">
					
					<div class="form-wrapper">
						<form>
							<div class="mb-3">
								<label for="email" class="form-label">Email address</label>
								<input type="email" class="form-control" id="email" placeholder="name@example.com">
							</div>
							<div class="mb-3">
								<label for="password" class="form-label">Password</label>
								<input type="password" class="form-control" id="password" placeholder="Password">
							</div>
							<div class="d-grid">
								<button type="submit" class="btn btn-primary btn-lg" style="margin-top: 20px;">Login</button>
							</div>

							<div class="text-center mt-4">
								<p>Don't have an account? <a href="register.html">Create one</a></p>
								<a href="forgot-password.html">Forgot your password?</a>
							</div>
						</form>
					</div>

				</div>
			</div>
		</div>
	</section>
	
	<footer id="footer">
		</footer>

	<div id="footer-bottom">
		</div>

</body>
</html>
