<!DOCTYPE html>
<html lang="en">

<head>
	<title>SmartCart - Checkout</title> <meta charset="utf-t">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">

	<link rel="stylesheet" type="text/css" href="css/normalize.css">
	<link rel="stylesheet" type="text/css" href="icomoon/icomoon.css">
	<link rel="stylesheet" type="text/css" href="css/vendor.css">
	<link rel="stylesheet" type="text/css" href="style.css">
	
	<style>
		.form-wrapper {
			padding: 40px;
			background: #fff;
			border: 1px solid #EAE8DF;
		}
		.form-wrapper .form-control {
			height: 55px;
			border-color: #EAE8DF;
		}
		.form-wrapper .form-control:focus {
			border-color: var(--accent-color);
			box-shadow: 0 0 0 0.25rem rgba(197, 169, 146, .25);
		}
		.order-summary {
			background-color: #EDEBE4; /* Matches theme background */
			padding: 30px;
		}
		.order-summary .list-group-item {
			background-color: transparent;
			border-color: #E0E0E0;
		}
	</style>

</head>

<body>

	<div id="header-wrap">
		<header id="header">
			</header>
	</div><section id="checkout-page" class="py-5 my-5">
		<div class="container">
			<div class="row">
				<div class="col-md-12">
					<div class="section-header align-center">
						<h2 class="section-title">Checkout</h2>
					</div>
				</div>
			</div>

			<div class="row">

				<div class="col-md-7">
					<div class="form-wrapper">
						<form>
							<h4>Shipping Address</h4>
							<hr class="my-3">
							<div class="row">
								<div class="col-md-6 mb-3">
									<label for="firstName" class="form-label">First Name</label>
									<input type="text" class="form-control" id="firstName">
								</div>
								<div class="col-md-6 mb-3">
									<label for="lastName" class="form-label">Last Name</label>
									<input type="text" class="form-control" id="lastName">
								</div>
							</div>
							<div class="mb-3">
								<label for="street" class="form-label">Street Address</label>
								<input type="text" class="form-control" id="street" placeholder="123 Test St">
							</div>
							<div class="mb-3">
								<label for="city" class="form-label">City</label>
								<input type="text" class="form-control" id="city" placeholder="Cairo">
							</div>
							<div class="row">
								<div class="col-md-6 mb-3">
									<label for="state" class="form-label">State (Optional)</label>
									<input type="text" class="form-control" id="state">
								</div>
								<div class="col-md-6 mb-3">
									<label for="zip" class="form-label">Zip Code (Optional)</label>
									<input type="text" class="form-control" id="zip">
								</div>
							</div>
							<div class="mb-3">
								<label for="country" class="form-label">Country</label>
								<input type="text" class="form-control" id="country" placeholder="Egypt">
							</div>

							<h4 class="mt-5">Payment Details</h4>
							<hr class="my-3">
							<p>We will add the Stripe Payment Form here.</p>
							<div id="payment-element" style="height: 100px; border: 1px dashed #ccc; padding: 10px; text-align: center; line-height: 80px; color: #999;">
								[Stripe credit card form will go here]
							</div>
							
							<div class="d-grid">
								<button type="submit" class="btn btn-primary btn-lg" style="margin-top: 30px;">Place Order</button>
							</div>
						</form>
					</div>
				</div>

				<div class="col-md-5">
					<div class="order-summary">
						<h4 class="section-title" style="font-size: 1.5em; margin-bottom: 30px;">Order Summary</h4>
						
						<div class="d-flex justify-content-between mb-3">
							<div class="d-flex">
								<img src="images/tab-item1.jpg" alt="Product" class="img-thumbnail" style="width: 60px; height: 75px; object-fit: cover; margin-right: 15px;">
								<div>
									<h6 style="margin-bottom: 0;">Portrait photography</h6>
									<span class="text-muted" style="font-size: 0.9em;">Qty: 2</span>
								</div>
							</div>
							<strong>$ 80.00</strong>
						</div>

						<div class="d-flex justify-content-between mb-3">
							<div class="d-flex">
								<img src="images/tab-item2.jpg" alt="Product" class="img-thumbnail" style="width: 60px; height: 75px; object-fit: cover; margin-right: 15px;">
								<div>
									<h6 style="margin-bottom: 0;">Once upon a time</h6>
									<span class="text-muted" style="font-size: 0.9em;">Qty: 1</span>
								</div>
							</div>
							<strong>$ 35.00</strong>
						</div>

						<hr>

						<ul class="list-group list-group-flush">
							<li class="list-group-item d-flex justify-content-between align-items-center">
								Subtotal
								<span>$ 115.00</span>
							</li>
							<li class="list-group-item d-flex justify-content-between align-items-center">
								Shipping
								<span>$ 5.00</span>
							</li>
							<li class="list-group-item d-flex justify-content-between align-items-center" style="font-weight: bold; font-size: 1.2em; color: var(--dark-color);">
								Total
								<span>$ 120.00</span>
							</li>
						</ul>
					</div>
				</div>

			</div>
		</div>
	</section>
	
	<footer id="footer">
		</footer>

	<div id="footer-bottom">
		</div>

</body>
</html>
