version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: smartcart-redis-dev
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: smartcart-backend-dev
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env.dev
    depends_on:
      - redis
