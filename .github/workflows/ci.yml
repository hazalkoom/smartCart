name: SmartCart CI Guardrail

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # JOB 1: Unit Tests (Fast - Checks Logic)
  unit-tests:
    name: Unit Tests (Jest)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    - name: Install Dependencies
      run: |
        cd backend
        npm ci
        
    - name: Run Jest
      run: |
        cd backend
        npm test

  # JOB 2: Functional Tests (Slow - Checks System)
  functional-tests:
    name: Functional Tests (Pytest)
    runs-on: ubuntu-latest
    needs: unit-tests # Only runs if Unit Tests pass

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: --health-cmd mongosh --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    # Setup Backend
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install Backend Deps
      run: |
        cd backend
        npm ci

    # Setup Python
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python Deps
      run: |
        pip install requests pytest pytest-ordering locust uuid

    # Initialize DB (The "Nuclear Option" script)
    - name: Seed Database
      run: |
        cd backend
        node reset_db_hard.js
      env:
        DB_URI: "mongodb://127.0.0.1:27017/smartCart"

    # Start Server (Background)
    - name: Start Server
      run: |
        cd backend
        npm start &
        echo "Waiting for server..."
        sleep 10
      env:
        DB_URI: "mongodb://127.0.0.1:27017/smartCart"
        JWT_SECRET: "test_secret_123" 
        # Add your PAYMOB keys here as secrets later if needed

    # Run the Bulletproof Suite
    - name: Run Pytest
      run: |
        pytest tests/functional