name: SmartCart CI Guardrail

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # JOB 1: Unit Tests (Fast - Checks Logic)
  unit-tests:
    name: Unit Tests (Jest)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    - name: Install Dependencies
      run: |
        cd backend
        npm ci
        
    - name: Run Jest
      run: |
        cd backend
        npm test

  # JOB 2: Functional Tests (Slow - Checks System)
  functional-tests:
    name: Functional Tests (Pytest)
    runs-on: ubuntu-latest
    needs: unit-tests # Only runs if Unit Tests pass

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: --health-cmd mongosh --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    # Setup Backend
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install Backend Deps
      run: |
        cd backend
        npm ci

    # Setup Python
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python Deps
      run: |
        pip install requests pytest pytest-ordering locust uuid

    # --- THE FIX STARTS HERE ---

    # 1. Wait for MongoDB to be ready
    - name: Wait for MongoDB
      run: |
        echo "Waiting for MongoDB on 127.0.0.1:27017..."
        for i in {1..30}; do
          if nc -z 127.0.0.1 27017; then
            echo "MongoDB is up!"
            exit 0
          fi
          echo "Waiting..."
          sleep 1
        done
        echo "MongoDB failed to start"
        exit 1

    # 2. Seed Database (Safe now that Mongo is up)
    - name: Seed Database
      run: |
        cd backend
        node reset_db_hard.js
      env:
        DB_URI: "mongodb://127.0.0.1:27017/smartCart"

    # 3. Start Server & Wait for Port 5000
    - name: Start Server
      run: |
        cd backend
        # Start in background, set PORT explicitly, redirect logs to file
        PORT=5000 DB_URI="mongodb://127.0.0.1:27017/smartCart" JWT_SECRET="test_secret_123" npm start > server.log 2>&1 &
        SERVER_PID=$!
        echo "Server PID: $SERVER_PID"
        
        # Wait Loop: Check if Port 5000 is open
        echo "Waiting for Server on 127.0.0.1:5000..."
        for i in {1..60}; do
          if nc -z 127.0.0.1 5000; then
            echo "Server is listening on Port 5000!"
            exit 0
          fi
          echo "Server not ready yet (attempt $i)..."
          sleep 1
        done
        
        # If we get here, it failed. Print logs to debug.
        echo "Server failed to start. Printing logs:"
        cat server.log
        exit 1

    # --- THE FIX ENDS HERE ---

    # Run the Bulletproof Suite
    - name: Run Pytest
      run: |
        pytest tests/functional