name: SmartCart CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  unit-tests:
    name: Unit Tests (Jest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Deps
        run: |
          cd backend
          npm ci

      - name: Run Jest
        run: |
          cd backend
          npx jest --config jest.config.js

  system-tests:
    name: System Tests (Pytest)
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'" 
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Deps
        run: |
          cd backend
          npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Deps
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-ordering requests

      - name: Wait for MongoDB
        run: |
          echo "Waiting for MongoDB..."
          for i in {1..60}; do
            if nc -z 127.0.0.1 27017; then
              echo "MongoDB is up!"
              exit 0
            fi
            sleep 1
          done
          echo "MongoDB did not become ready"
          exit 1

      - name: Seed Database
        run: |
          cd backend
          node reset_db_hard.js
        env:
          MONGODB_URI: "mongodb://127.0.0.1:27017/smartCart"

      - name: Start Server
        env:
          NODE_ENV: "test"
          PORT: 5000
          MONGODB_URI: "mongodb://127.0.0.1:27017/smartCart"
          JWT_SECRET: "dummy_jwt_secret"
          JWT_EXPIRE: "7d"
          PAYMOB_API_KEY: "dummy_paymob_api_key"
          PAYMOB_INTEGRATION_ID_CARD: "5482753"
          PAYMOB_INTEGRATION_ID_WALLET: "5482764"
          PAYMOB_INTEGRATION_ID_FAWRY: "5482773"
          PAYMOB_HMAC_SECRET: "dummy_paymob_hmac_secret"
          PAYMOB_IFRAME_ID: "1000652"
        run: |
          cd backend
          npm start > server.log 2>&1 &

          echo "Waiting for server on 127.0.0.1:5000..."
          for i in {1..60}; do
            if nc -z 127.0.0.1 5000; then
              echo "Server is up"
              exit 0
            fi
            if [ -f server.log ]; then
              if grep -q "Error" server.log; then
                break
              fi
            fi
            sleep 1
          done

          echo "Server failed to start. server.log:"
          cat server.log || true
          exit 1

      - name: Run Pytest (Functional + Security)
        env:
          BASE_URL: "http://localhost:5000/api/v1"
        run: pytest tests/functional tests/security