name: SmartCart CI Guardrail

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # JOB 1: Unit Tests (Fast Logic Check)
  unit-tests:
    name: Unit Tests (Jest)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    - name: Install Dependencies
      run: |
        cd backend
        npm ci
        
    - name: Run Jest
      run: |
        cd backend
        npm test

  # JOB 2: Functional Tests (System Check)
  functional-tests:
    name: Functional Tests (Pytest)
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: --health-cmd mongosh --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    # --- SETUP ENVIRONMENTS ---
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install Backend Deps
      run: cd backend && npm ci

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Using the requirements file you just created!
    - name: Install Python Deps
      run: |
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-ordering locust uuid requests

    # --- START DATABASE ---
    - name: Wait for MongoDB
      run: |
        echo "Waiting for MongoDB..."
        for i in {1..30}; do
          if nc -z 127.0.0.1 27017; then
            echo "MongoDB is up!"
            exit 0
          fi
          sleep 1
        done
        exit 1

    - name: Seed Database
      run: cd backend && node reset_db_hard.js
      env:
        # We set BOTH names to be safe
        DB_URI: "mongodb://127.0.0.1:27017/smartCart"
        MONGO_URI: "mongodb://127.0.0.1:27017/smartCart"

    # --- START SERVER (The Critical Fix) ---
    - name: Start Server
      run: |
        cd backend
        # 1. Set EVERY possible env var to prevent "undefined" crashes
        # 2. Use dummy Paymob keys to prevent startup checks from failing
        PORT=5000 \
        NODE_ENV="test" \
        DB_URI="mongodb://127.0.0.1:27017/smartCart" \
        MONGO_URI="mongodb://127.0.0.1:27017/smartCart" \
        JWT_SECRET="test_secret_123" \
        PAYMOB_API_KEY="dummy_key" \
        PAYMOB_INTEGRATION_ID_CARD="123" \
        PAYMOB_INTEGRATION_ID_WALLET="456" \
        PAYMOB_IFRAME_ID="789" \
        npm start > server.log 2>&1 &
        
        SERVER_PID=$!
        echo "Server PID: $SERVER_PID"
        
        # Smart Wait Loop
        echo "Waiting for Server on 127.0.0.1:5000..."
        for i in {1..60}; do
          if nc -z 127.0.0.1 5000; then
            echo "Server is listening!"
            exit 0
          fi
          sleep 1
        done
        
        echo "Server failed to start. Printing logs:"
        cat server.log
        exit 1

    # --- RUN TESTS ---
    - name: Run Pytest
      run: pytest tests/functional
      env:
         # Ensure tests know where to look
         BASE_URL: "http://localhost:5000/api/v1"