name: SmartCart CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  unit-tests:
    name: Unit Tests (Jest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Deps
        run: |
          cd backend
          npm ci

      - name: Run Jest
        run: |
          cd backend
          npx jest --config jest.config.js

  system-tests:
    name: System Tests (Pytest)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Deps
        run: |
          cd backend
          npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Deps
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-ordering requests

      - name: Start MongoDB (Replica Set)
        run: |
          docker run -d --name smartcart-mongo -p 27017:27017 mongo:6.0 \
            mongod --replSet rs0 --bind_ip_all --port 27017

      - name: Wait for MongoDB
        run: |
          echo "Waiting for MongoDB..."
          for i in {1..60}; do
            if nc -z 127.0.0.1 27017; then
              echo "MongoDB is up!"
              exit 0
            fi
            sleep 1
          done
          echo "MongoDB did not become ready"
          exit 1

      - name: Init MongoDB Replica Set
        run: |
          echo "Initializing Mongo replica set (rs0)..."
          docker exec smartcart-mongo mongosh --eval "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }]}) }"

          echo "Waiting for rs0 to become PRIMARY..."
          for i in {1..60}; do
            STATE=$(docker exec smartcart-mongo mongosh --quiet --eval "try { rs.status().myState } catch(e) { 0 }")
            if [ "$STATE" = "1" ]; then
              echo "Replica set is PRIMARY"
              exit 0
            fi
            sleep 1
          done

          echo "Replica set did not become PRIMARY"
          docker exec smartcart-mongo mongosh --eval "rs.status()" || true
          exit 1

      - name: Seed Database
        run: |
          cd backend
          node reset_db_hard.js
        env:
          MONGODB_URI: "mongodb://127.0.0.1:27017/smartCart?replicaSet=rs0"

      - name: Start Server
        env:
          NODE_ENV: "test"
          PORT: 5000
          MONGODB_URI: "mongodb://127.0.0.1:27017/smartCart?replicaSet=rs0"
          JWT_SECRET: "dummy_jwt_secret"
          JWT_EXPIRE: "7d"
          PAYMOB_API_KEY: "dummy_paymob_api_key"
          PAYMOB_INTEGRATION_ID_CARD: "5482753"
          PAYMOB_INTEGRATION_ID_WALLET: "5482764"
          PAYMOB_INTEGRATION_ID_FAWRY: "5482773"
          PAYMOB_HMAC_SECRET: "dummy_paymob_hmac_secret"
          PAYMOB_IFRAME_ID: "1000652"
        run: |
          cd backend
          npm start > server.log 2>&1 &

          echo "Waiting for server on 127.0.0.1:5000..."
          for i in {1..60}; do
            if nc -z 127.0.0.1 5000; then
              echo "Server is up"
              exit 0
            fi
            if [ -f server.log ]; then
              if grep -q "Error" server.log; then
                break
              fi
            fi
            sleep 1
          done

          echo "Server failed to start. server.log:"
          cat server.log || true
          exit 1

      - name: Run Pytest (Functional + Security)
        env:
          BASE_URL: "http://localhost:5000/api/v1"
        run: pytest tests/functional tests/security

      - name: Print server.log on failure
        if: failure()
        run: |
          echo "--- backend/server.log (last 400 lines) ---"
          if [ -f backend/server.log ]; then tail -n 400 backend/server.log; else echo "server.log not found"; fi