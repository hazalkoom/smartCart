name: SmartCart CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: ["main", "master"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: smartcart-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Deps
        working-directory: backend
        run: npm ci

      - name: Run Jest
        working-directory: backend
        run: npm test

  frontend-build:
    name: Frontend Build (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Deps
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Build
        working-directory: frontend
        run: npm run build

  system-tests:
    name: System + Security Tests (Pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [unit-tests]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 5000
      PYTEST_AUTOSTART_BACKEND: "0"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      MONGODB_URI: mongodb://127.0.0.1:27017/smartCart?replicaSet=rs0
      BASE_URL: http://127.0.0.1:5000/api/v1
      JWT_SECRET: dummy_jwt_secret
      JWT_EXPIRE: 7d
      PAYMOB_API_KEY: dummy_paymob_api_key
      PAYMOB_INTEGRATION_ID_CARD: "5482753"
      PAYMOB_INTEGRATION_ID_WALLET: "5482764"
      PAYMOB_INTEGRATION_ID_FAWRY: "5482773"
      PAYMOB_HMAC_SECRET: "9398BBEE4367A5BB6119DD67EECECC1D"
      PAYMOB_IFRAME_ID: "1000652"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Deps
        working-directory: backend
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python Deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-ordering pytest-timeout requests

      - name: Start MongoDB Replica Set
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: '6.0'
          mongodb-replica-set: rs0
          mongodb-port: 27017

      - name: Seed Database
        working-directory: backend
        run: node reset_db_hard.js

      - name: Start Backend Server
        working-directory: backend
        run: npm start > server.log 2>&1 &

      - name: Wait for API Health
        run: |
          for i in {1..90}; do
            if curl -fsS "http://127.0.0.1:5000/api/v1/health" >/dev/null; then
              echo "Backend is healthy"
              exit 0
            fi
            sleep 1
          done

          echo "Backend did not become healthy in time"
          if [ -f backend/server.log ]; then tail -n 400 backend/server.log; fi
          exit 1

      - name: Run Pytest (Functional + Security)
        run: pytest tests/functional tests/security -vv -ra --maxfail=1 --durations=20 --timeout=45

      - name: Print backend server log on failure
        if: failure()
        run: |
          echo "--- backend/server.log (last 400 lines) ---"
          if [ -f backend/server.log ]; then tail -n 400 backend/server.log; else echo "server.log not found"; fi