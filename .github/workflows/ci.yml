name: SmartCart CI Guardrail

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # JOB 1: Unit Tests
  unit-tests:
    name: Unit Tests (Jest)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    - name: Install Dependencies
      run: |
        cd backend
        npm ci
    - name: Run Jest
      run: |
        cd backend
        npm test

  # JOB 2: Functional Tests
  functional-tests:
    name: Functional Tests (Pytest)
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: --health-cmd mongosh --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    # Setup Env
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    - name: Install Backend Deps
      run: cd backend && npm ci

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install Python Deps
      run: pip install requests pytest pytest-ordering locust uuid

    # 1. Wait for Mongo
    - name: Wait for MongoDB
      run: |
        echo "Waiting for MongoDB on 127.0.0.1:27017..."
        for i in {1..30}; do
          if nc -z 127.0.0.1 27017; then
            echo "MongoDB is up!"
            exit 0
          fi
          sleep 1
        done
        exit 1

    # 2. Seed DB
    - name: Seed Database
      run: cd backend && node reset_db_hard.js
      env:
        DB_URI: "mongodb://127.0.0.1:27017/smartCart"

    # 3. Start Server (With Dummy Keys & Log Capture)
    - name: Start Server
      run: |
        cd backend
        # Use dummy keys to prevent startup crashes if env vars are checked early
        PORT=5000 \
        DB_URI="mongodb://127.0.0.1:27017/smartCart" \
        JWT_SECRET="test_secret_123" \
        PAYMOB_API_KEY="dummy_key" \
        PAYMOB_INTEGRATION_ID_CARD="123" \
        PAYMOB_INTEGRATION_ID_WALLET="456" \
        PAYMOB_IFRAME_ID="789" \
        npm start > server.log 2>&1 &
        
        SERVER_PID=$!
        echo "Server PID: $SERVER_PID"
        
        # Wait Loop
        echo "Waiting for Server on 127.0.0.1:5000..."
        for i in {1..60}; do
          if nc -z 127.0.0.1 5000; then
            echo "Server is listening!"
            exit 0
          fi
          sleep 1
        done
        echo "Server failed to start within timeout."
        exit 1

    # 4. Run Pytest
    - name: Run Pytest
      run: pytest tests/functional

    # 5. DEBUG: Print Logs if ANYTHING fails
    - name: Print Server Logs (On Failure)
      if: failure()
      run: |
        cd backend
        echo "================ SERVER LOGS START ================"
        cat server.log
        echo "================ SERVER LOGS END ================"