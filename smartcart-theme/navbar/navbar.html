<!-- =====================================================
     NAVBAR — drop into your navbar component HTML
     ===================================================== -->
<header class="sc-navbar" [class.scrolled]="isScrolled">
  <div class="sc-navbar-inner">

    <!-- Logo -->
    <a routerLink="/" class="sc-logo">
      <div class="sc-logo-icon">
        <i class="icon icon-zap"></i>
      </div>
      <span class="sc-logo-text">SMARTCART</span>
    </a>

    <!-- Desktop Nav -->
    <nav class="sc-nav-links">
      <a routerLink="/"          routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Home</a>
      <a routerLink="/products"  routerLinkActive="active">Products</a>
      <a routerLink="/categories" routerLinkActive="active">Categories</a>
      <a routerLink="/gift-finder" routerLinkActive="active" class="sc-nav-special">
        <i class="icon icon-gift"></i> Gift Finder
      </a>
      <a routerLink="/about"     routerLinkActive="active">About</a>
    </nav>

    <!-- Actions -->
    <div class="sc-nav-actions">
      <!-- Search -->
      <button class="sc-icon-btn" (click)="toggleSearch()" aria-label="Search">
        <i class="icon icon-search"></i>
      </button>

      <!-- Wishlist -->
      <a routerLink="/wishlist" class="sc-icon-btn" aria-label="Wishlist">
        <i class="icon icon-heart"></i>
        <span class="sc-badge" *ngIf="wishlistCount > 0">{{ wishlistCount }}</span>
      </a>

      <!-- Cart -->
      <a routerLink="/cart" class="sc-icon-btn" aria-label="Cart">
        <i class="icon icon-shopping-cart"></i>
        <span class="sc-badge sc-badge-primary" *ngIf="cartCount > 0">{{ cartCount }}</span>
      </a>

      <!-- User -->
      <div class="dropdown" *ngIf="isLoggedIn">
        <button class="sc-user-btn dropdown-toggle" data-bs-toggle="dropdown">
          <div class="sc-avatar">{{ userInitials }}</div>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" routerLink="/account"><i class="icon icon-user"></i> My Account</a></li>
          <li><a class="dropdown-item" routerLink="/orders"><i class="icon icon-package"></i> Orders</a></li>
          <li><a class="dropdown-item" routerLink="/wishlist"><i class="icon icon-heart"></i> Wishlist</a></li>
          <li><hr class="dropdown-divider" style="border-color: var(--border)"></li>
          <li><button class="dropdown-item text-danger" (click)="logout()"><i class="icon icon-log-out"></i> Logout</button></li>
        </ul>
      </div>

      <div class="sc-auth-links" *ngIf="!isLoggedIn">
        <a routerLink="/login"    class="sc-auth-link">Login</a>
        <a routerLink="/register" class="btn btn-primary btn-sm">Sign Up</a>
      </div>

      <!-- Mobile toggle -->
      <button class="sc-hamburger" (click)="toggleMobileMenu()" aria-label="Menu">
        <span [class.open]="mobileMenuOpen"></span>
        <span [class.open]="mobileMenuOpen"></span>
        <span [class.open]="mobileMenuOpen"></span>
      </button>
    </div>
  </div>

  <!-- Search bar dropdown -->
  <div class="sc-search-bar" [class.visible]="searchOpen">
    <div class="sc-search-inner">
      <i class="icon icon-search"></i>
      <input type="text" placeholder="Search products, brands, categories..." [(ngModel)]="searchQuery" (keyup.enter)="submitSearch()" autofocus>
      <button class="sc-search-close" (click)="toggleSearch()"><i class="icon icon-x"></i></button>
    </div>
  </div>

  <!-- Mobile menu -->
  <div class="sc-mobile-menu" [class.open]="mobileMenuOpen">
    <a routerLink="/"           (click)="closeMobileMenu()">Home</a>
    <a routerLink="/products"   (click)="closeMobileMenu()">Products</a>
    <a routerLink="/categories" (click)="closeMobileMenu()">Categories</a>
    <a routerLink="/gift-finder" (click)="closeMobileMenu()" class="sc-nav-special"><i class="icon icon-gift"></i> Gift Finder</a>
    <a routerLink="/about"      (click)="closeMobileMenu()">About</a>
    <a routerLink="/wishlist"   (click)="closeMobileMenu()" *ngIf="isLoggedIn">Wishlist</a>
    <a routerLink="/account"    (click)="closeMobileMenu()" *ngIf="isLoggedIn">Account</a>
    <a routerLink="/login"      (click)="closeMobileMenu()" *ngIf="!isLoggedIn">Login</a>
    <a routerLink="/register"   (click)="closeMobileMenu()" *ngIf="!isLoggedIn">Register</a>
  </div>
</header>
