<!-- =====================================================
     LOGIN PAGE
     ===================================================== -->
<section class="sc-auth-page">
  <div class="sc-auth-glow sc-auth-glow--cyan"></div>
  <div class="sc-auth-glow sc-auth-glow--purple"></div>

  <div class="sc-auth-card">

    <!-- Logo -->
    <div class="sc-auth-logo">
      <div class="sc-auth-logo-icon"><i class="icon icon-zap"></i></div>
      <span>SMARTCART</span>
    </div>

    <h1 class="sc-auth-title">Welcome Back</h1>
    <p class="sc-auth-sub">Sign in to your account to continue</p>

    <!-- Error alert -->
    <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" novalidate>

      <div class="sc-form-group">
        <label class="form-label">Email Address</label>
        <div class="sc-input-wrap">
          <i class="icon icon-mail sc-input-icon"></i>
          <input type="email" class="form-control sc-auth-input" [(ngModel)]="email" name="email"
                 placeholder="you@example.com" required autocomplete="email">
        </div>
      </div>

      <div class="sc-form-group">
        <label class="form-label">Password</label>
        <div class="sc-input-wrap">
          <i class="icon icon-lock sc-input-icon"></i>
          <input [type]="showPassword ? 'text' : 'password'" class="form-control sc-auth-input"
                 [(ngModel)]="password" name="password" placeholder="Your password" required
                 autocomplete="current-password">
          <button type="button" class="sc-pw-toggle" (click)="showPassword = !showPassword">
            <i class="icon" [class.icon-eye]="!showPassword" [class.icon-eye-off]="showPassword"></i>
          </button>
        </div>
      </div>

      <div class="sc-auth-options">
        <label class="sc-remember">
          <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe">
          <span>Remember me</span>
        </label>
        <a routerLink="/forgot-password" class="sc-forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary sc-auth-btn" [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="!isLoading">Sign In <i class="icon icon-arrow-right ms-2"></i></span>
        <span *ngIf="isLoading" class="sc-spinner-sm"></span>
      </button>

    </form>

    <div class="sc-auth-divider"><span>or</span></div>

    <p class="sc-auth-switch">
      Don't have an account?
      <a routerLink="/register">Create one</a>
    </p>
  </div>
</section>
