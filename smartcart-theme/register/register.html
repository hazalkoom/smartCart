<!-- =====================================================
     REGISTER PAGE
     ===================================================== -->
<section class="sc-auth-page">
  <div class="sc-auth-glow sc-auth-glow--cyan"></div>
  <div class="sc-auth-glow sc-auth-glow--purple"></div>

  <div class="sc-auth-card">

    <div class="sc-auth-logo">
      <div class="sc-auth-logo-icon"><i class="icon icon-zap"></i></div>
      <span>SMARTCART</span>
    </div>

    <h1 class="sc-auth-title">Create Account</h1>
    <p class="sc-auth-sub">Join and get access to exclusive deals</p>

    <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm" novalidate>

      <div class="sc-form-row sc-reg-name-row">
        <div class="sc-form-group">
          <label class="form-label">First Name</label>
          <div class="sc-input-wrap">
            <i class="icon icon-user sc-input-icon"></i>
            <input type="text" class="form-control sc-auth-input"
                   [(ngModel)]="firstName" name="firstName" placeholder="First" required>
          </div>
        </div>
        <div class="sc-form-group">
          <label class="form-label">Last Name</label>
          <div class="sc-input-wrap">
            <i class="icon icon-user sc-input-icon"></i>
            <input type="text" class="form-control sc-auth-input"
                   [(ngModel)]="lastName" name="lastName" placeholder="Last" required>
          </div>
        </div>
      </div>

      <div class="sc-form-group">
        <label class="form-label">Email Address</label>
        <div class="sc-input-wrap">
          <i class="icon icon-mail sc-input-icon"></i>
          <input type="email" class="form-control sc-auth-input"
                 [(ngModel)]="email" name="email" placeholder="you@example.com" required>
        </div>
      </div>

      <div class="sc-form-group">
        <label class="form-label">Password</label>
        <div class="sc-input-wrap">
          <i class="icon icon-lock sc-input-icon"></i>
          <input [type]="showPassword ? 'text' : 'password'" class="form-control sc-auth-input"
                 [(ngModel)]="password" name="password" placeholder="Min 8 characters" required minlength="8">
          <button type="button" class="sc-pw-toggle" (click)="showPassword = !showPassword">
            <i class="icon" [class.icon-eye]="!showPassword" [class.icon-eye-off]="showPassword"></i>
          </button>
        </div>
        <!-- Strength bar -->
        <div class="sc-pw-strength" *ngIf="password">
          <div class="sc-pw-strength-bar">
            <div class="sc-pw-strength-fill" [style.width.%]="passwordStrength" [class.weak]="passwordStrength < 40" [class.medium]="passwordStrength >= 40 && passwordStrength < 75" [class.strong]="passwordStrength >= 75"></div>
          </div>
          <span class="sc-pw-strength-label">{{ passwordStrengthLabel }}</span>
        </div>
      </div>

      <div class="sc-form-group">
        <label class="form-label">Confirm Password</label>
        <div class="sc-input-wrap">
          <i class="icon icon-lock sc-input-icon"></i>
          <input [type]="showPassword ? 'text' : 'password'" class="form-control sc-auth-input"
                 [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Repeat password" required>
        </div>
        <small class="sc-pw-mismatch" *ngIf="confirmPassword && password !== confirmPassword">Passwords don't match</small>
      </div>

      <div class="sc-form-group">
        <label class="sc-terms-label">
          <input type="checkbox" [(ngModel)]="acceptTerms" name="acceptTerms" required>
          <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary sc-auth-btn"
              [disabled]="registerForm.invalid || !acceptTerms || password !== confirmPassword || isLoading">
        <span *ngIf="!isLoading">Create Account <i class="icon icon-arrow-right ms-2"></i></span>
        <span *ngIf="isLoading" class="sc-spinner-sm"></span>
      </button>

    </form>

    <div class="sc-auth-divider"><span>already have an account?</span></div>
    <p class="sc-auth-switch">
      <a routerLink="/login">Sign In Instead</a>
    </p>
  </div>
</section>
